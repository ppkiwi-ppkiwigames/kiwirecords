<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kiwi Music</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0a0a0a,#111827,#0f172a);
    min-height:100vh;
    overflow:hidden;
    color:white;
}

.backgroundGlow{
    position:fixed;
    width:700px;
    height:700px;
    background:#00ff88;
    filter:blur(180px);
    opacity:.15;
    border-radius:50%;
    top:-200px;
    right:-150px;
    animation:float 8s ease-in-out infinite;
}

.backgroundGlow2{
    position:fixed;
    width:600px;
    height:600px;
    background:#00b7ff;
    filter:blur(170px);
    opacity:.12;
    border-radius:50%;
    bottom:-200px;
    left:-150px;
    animation:float 10s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(40px);}
    100%{transform:translateY(0px);}
}

.app{
    display:flex;
    height:100vh;
    position:relative;
    z-index:2;
}

.sidebar{
    width:260px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border-right:1px solid rgba(255,255,255,0.08);
    padding:25px;
}

.logo{
    font-size:32px;
    font-weight:700;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    margin-bottom:35px;
}

.playlistTitle{
    font-size:15px;
    color:#9ca3af;
    margin-bottom:15px;
}

.songList{
    overflow-y:auto;
    height:calc(100vh - 140px);
}

.song{
    padding:14px;
    border-radius:14px;
    margin-bottom:12px;
    background:rgba(255,255,255,0.04);
    cursor:pointer;
    transition:.25s;
    border:1px solid transparent;
}

.song:hover{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(0,255,136,.4);
    transform:translateX(4px);
}

.song.active{
    background:rgba(0,255,136,.15);
    border:1px solid #00ff88;
    box-shadow:0 0 20px rgba(0,255,136,.25);
}

.songTitle{
    font-weight:600;
}

.songArtist{
    font-size:12px;
    opacity:.7;
}

.main{
    flex:1;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.album{
    width:300px;
    height:300px;
    border-radius:30px;
    background:linear-gradient(145deg,#00ff88,#00b7ff);
    box-shadow:0 0 80px rgba(0,255,136,.5);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
    margin-bottom:35px;
    animation:pulse 4s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.03);}
    100%{transform:scale(1);}
}

.nowPlaying h1{
    font-size:40px;
    margin-bottom:10px;
}

.nowPlaying p{
    color:#9ca3af;
}

.controls{
    display:flex;
    gap:20px;
    margin-top:35px;
}

.controlBtn{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:26px;
    cursor:pointer;
    transition:.25s;
}

.controlBtn:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px rgba(0,255,136,.4);
}

.playBtn{
    background:linear-gradient(90deg,#00ff88,#00b7ff);
    color:black;
    font-weight:700;
}

.progressContainer{
    width:80%;
    max-width:650px;
    height:10px;
    background:rgba(255,255,255,.1);
    border-radius:999px;
    overflow:hidden;
    margin-top:35px;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00ff88,#00b7ff);
}

.time{
    margin-top:12px;
    color:#9ca3af;
}
</style>
</head>

<body>

<div class="backgroundGlow"></div>
<div class="backgroundGlow2"></div>

<div class="app">

    <div class="sidebar">
        <div class="logo">🥝 Kiwi Music</div>

        <div class="playlistTitle">GLOBAL PLAYLIST</div>
        <div class="songList" id="songList"></div>
    </div>

    <div class="main">

        <div class="album">🎵</div>

        <div class="nowPlaying">
            <h1 id="title">Loading...</h1>
            <p id="artist">Kiwi Music</p>
        </div>

        <div class="controls">
            <button class="controlBtn" id="prevBtn">⏮</button>
            <button class="controlBtn playBtn" id="playBtn">▶</button>
            <button class="controlBtn" id="nextBtn">⏭</button>
        </div>

        <div class="progressContainer">
            <div class="progress" id="progress"></div>
        </div>

        <div class="time" id="time">0:00 / 0:00</div>

    </div>
</div>

<audio id="audio"></audio>

<script>
// 🌍 GLOBAL SONG LIST (EDIT THESE LINKS)
let songs = [
    {
        name: "Crazy Story",
        artist: "King Von",
        url: "https://ppkiwi-ppkiwigames.github.io/kiwirecords/King%20Von%20-%20Crazy%20Story%20(Official%20Music%20Video).mp3"
    },
    {
        name: "FUNK ABNORMAL (SUPER SLOWED)",
        artist: "DJ V12",
        url: "https://ppkiwi-ppkiwigames.github.io/kiwirecords/FUNK%20ABNORMAL%20(SUPER%20SLOWED).mp3"
    },
    {
        name: "Ransom",
        artist: "Lil Tecca",
        url: "https://ppkiwi-ppkiwigames.github.io/kiwirecords/Lil%20Tecca%20-%20Ransom%20(Lyrics).mp3"
    },
        {
        name: "Billie Jean",
        artist: "Michael Jackson",
        url: "https://ppkiwi-ppkiwigames.github.io/kiwirecords/Michael%20Jackson%20-%20Billie%20Jean%20(Official%20Video).mp3"
    }
];

const songList = document.getElementById("songList");
const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const time = document.getElementById("time");

let currentSong = 0;

function renderSongs(){
    songList.innerHTML = "";

    songs.forEach((song, index) => {
        const div = document.createElement("div");
        div.className = "song";
        div.id = "song-" + index;

        div.innerHTML = `
            <div class="songTitle">${song.name}</div>
            <div class="songArtist">${song.artist}</div>
        `;

        div.onclick = () => {
            currentSong = index;
            loadSong(index);
            playSong();
        };

        songList.appendChild(div);
    });
}

function loadSong(index){
    const song = songs[index];
    if(!song) return;

    audio.src = song.url;
    title.textContent = song.name;
    artist.textContent = song.artist;

    document.querySelectorAll(".song").forEach(s => s.classList.remove("active"));
    const el = document.getElementById("song-" + index);
    if(el) el.classList.add("active");
}

function playSong(){
    audio.play();
    playBtn.textContent = "⏸";
}

function pauseSong(){
    audio.pause();
    playBtn.textContent = "▶";
}

playBtn.onclick = () => {
    if(audio.paused) playSong();
    else pauseSong();
};

document.getElementById("nextBtn").onclick = () => {
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
    playSong();
};

document.getElementById("prevBtn").onclick = () => {
    currentSong = (currentSong - 1 + songs.length) % songs.length;
    loadSong(currentSong);
    playSong();
};

audio.addEventListener("timeupdate", () => {
    progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    time.textContent =
        `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
});

audio.addEventListener("ended", () => {
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
    playSong();
});

function formatTime(s){
    if(isNaN(s)) return "0:00";
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
}

// INIT
renderSongs();
loadSong(0);
</script>

</body>
</html>
